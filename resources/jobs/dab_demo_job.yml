resources:
  jobs:
    dab_demo_job:
      name: dab_demo_job
      tasks:
        - task_key: dab_demo_notebook
          notebook_task:
            notebook_path: ../notebooks/dab_demo_job.py
            source: WORKSPACE
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
